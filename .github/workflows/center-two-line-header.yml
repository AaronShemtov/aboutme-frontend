name: center-two-line-header
on:
  push:
    branches: [fix/center-two-line-header]
  workflow_call:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/center-two-line-header'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/center-two-line-header
      - name: Patch and validate only ribbon text and scoped styles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pairs = [('about', 'me'), ('link', 'shortener'),
                   ('Kubernetes platform', 'architecture'), ('Agentic AI', 'architecture'),
                   ('AI SRE', 'agent'), ('secrets', 'toolkit'), ('IP', 'checker')]
          expected = [' '.join(pair) for pair in pairs]
          nav_re = re.compile(r'(<nav\b[^>]*\bclass="ribbon-nav"[^>]*>)(.*?)(</nav>)', re.S)
          anchor_re = re.compile(r'(<a\b[^>]*>)(.*?)(</a>)', re.S)
          changes = {}
          for path in sorted(Path('public').rglob('*.html')):
              original = path.read_bytes()
              text = original.decode('utf-8')
              navs = list(nav_re.finditer(text))
              if not navs:
                  assert 'ribbon-nav' not in text or '<nav' not in text, f'Unrecognized navigation: {path}'
                  continue
              assert len(navs) == 1, f'Expected one ribbon nav: {path}'
              nav = navs[0]
              inner = nav.group(2)
              anchors = list(anchor_re.finditer(inner))
              assert [a.group(2) for a in anchors] == expected, f'Unexpected labels/order: {path}'
              assert text.count('>Aaron Shemtov</a>') == 1, f'Unexpected brand: {path}'
              replacement = inner
              for a, pair in reversed(list(zip(anchors, pairs))):
                  replacement = replacement[:a.start(2)] + '<br>'.join(pair) + replacement[a.end(2):]
              after = list(anchor_re.finditer(replacement))
              assert len(after) == 7
              assert [a.group(1) for a in after] == [a.group(1) for a in anchors]
              assert [a.group(2).split('<br>') for a in after] == [list(pair) for pair in pairs]
              # Compare the rest of the nav too, including the myip theme button.
              strip_labels = lambda s: anchor_re.sub(lambda a: a.group(1) + a.group(3), s)
              assert strip_labels(inner) == strip_labels(replacement)
              updated = text[:nav.start(2)] + replacement + text[nav.end(2):]
              assert updated.replace(replacement, inner, 1) == text
              changes[path] = updated.encode('utf-8')
              print(f'{path}: 7 two-line labels; attributes and all other content preserved')
          assert changes, 'No served ribbon pages found'
          css_path = Path('public/style.css') if Path('public/style.css').exists() and not Path('public/blueprint.css').exists() else Path('public/blueprint.css')
          css = css_path.read_bytes()
          marker = b'/* Center ribbon labels without moving the existing header blocks. */'
          assert marker not in css, 'Header patch already present'
          override = b'''\n/* Center ribbon labels without moving the existing header blocks. */
          .ribbon .ribbon-left {
            justify-content: center;
          }
          .ribbon .ribbon-left .brand {
            white-space: nowrap;
            text-align: center;
          }
          .ribbon .ribbon-nav > a {
            display: block;
            text-align: center;
            white-space: nowrap;
            line-height: 1.2;
          }
          '''
          changes[css_path] = css + (b'' if css.endswith(b'\n') else b'\n') + override
          # Read and validate every input before writing; never reserialize HTML.
          for path, content in changes.items():
              path.write_bytes(content)
          PY
          git diff --check
          git diff --stat
      - name: Remove temporary workflow and commit only the reviewed-scope changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/center-two-line-header
          rm .github/workflows/center-two-line-header.yml
          git add -u -- public .github/workflows/center-two-line-header.yml
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert files and all(p == '.github/workflows/center-two-line-header.yml' or (p.startswith('public/') and p.endswith(('.html', '.css'))) for p in files), files
          PY
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Center ribbon labels and use explicit two-line navigation'
          git push origin HEAD:fix/center-two-line-header
